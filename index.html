<!DOCTYPE html>

<style>
  :root { --navy:#0D2B5C; --gold:#C8A44A; --bg:#f5f6fa; }

<body>
<div id="app">

<div id="overlay"></div>

<script>
"use strict";
/* ================================================================
 * 作业二：专注计数（Most et al., 2001 复现 + 负荷改进）与
 *         "你在这里"地图（Levine, 1982 复现 + 朝向线索改进）
 * 项目码：Q6ZCCR（公开，写进网页）；下载密钥绝不写进本文件。
 * ================================================================ */
const LAB = 'https://attention-lab-production.up.railway.app';
const PROJECT = 'Q6ZCCR';              // ← 6 位项目码

/* ---------------- 小工具 ---------------- */
const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const median = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const cv = $('#cv'), ctx = cv.getContext('2d');
// 高分辨率渲染：按设备像素比放大画布，绘制仍用 1280×800 逻辑坐标，避免视网膜屏模糊
const DPR = Math.max(1, window.devicePixelRatio || 1);
cv.width = 1280 * DPR; cv.height = 800 * DPR;
cv.style.width = '1280px'; cv.style.maxWidth = '100%'; cv.style.height = 'auto';
ctx.scale(DPR, DPR);
const FONT = '"PingFang SC","Microsoft YaHei",sans-serif';

let STATE = { nick: '', test: false, load: null };

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#' + id).classList.add('active');
}

/* ---------------- 覆盖式卡片（指导语 / 作答） ----------------
 * - 带 data-v 的按钮：点选即返回 { v: ... }
 * - <form>：提交时返回表单字段对象（含 data-pick 单选组写进的隐藏字段）
 * ------------------------------------------------------------- */
function card(html) {
  return new Promise((resolve) => {
    const ov = $('#overlay');
    ov.innerHTML = `<div class="card">${html}</div>`;
    ov.classList.add('show');
    const done = (val) => { ov.classList.remove('show'); ov.innerHTML = ''; resolve(val); };
    const form = ov.querySelector('form');
    if (form) form.addEventListener('submit', (e) => {
      e.preventDefault();
      // 校验必填的隐藏字段（pick 组）
      for (const h of form.querySelectorAll('input[type=hidden][required]')) {
        if (!h.value) { let w = form.querySelector('.warn-msg'); if (!w) { w = document.createElement('p'); w.className = 'warn warn-msg'; form.prepend(w); } w.textContent = '请先点选一个选项（没看到也请猜一个）。'; return; }
      }
      const out = {}; for (const [k, v] of new FormData(form).entries()) out[k] = v;
      done(out);
    });
    ov.querySelectorAll('[data-v]').forEach(b => b.onclick = (e) => { e.preventDefault(); done({ v: b.dataset.v }); });
    ov.querySelectorAll('[data-pick]').forEach(b => b.onclick = (e) => {
      e.preventDefault();
      const name = b.dataset.pick;
      ov.querySelectorAll(`[data-pick="${name}"]`).forEach(x => x.classList.toggle('on', x === b));
      const h = ov.querySelector(`input[name="${name}"]`); if (h) h.value = b.dataset.val;
    });
  });
}
const yesNo = (title, body) => `<h2>${title}</h2>${body || ''}<div class="actions"><button class="btn ghost" data-v="no">没有</button><button class="btn ghost" data-v="yes">有</button></div>`;

/* ---------------- 数据上传 ---------------- */
async function submitData(experiment, condition, trials) {
  const payload = {
    project: PROJECT,
    experiment: STATE.test ? 'test_' + experiment : experiment, // 调试数据加前缀，正式收数前在后台清空
    participant: STATE.nick,
    condition,
    trials,
    meta: { ua: navigator.userAgent.slice(0, 80), w: innerWidth, h: innerHeight },
  };
  try {
    const res = await fetch(LAB + '/api/hw2/submit', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
    const r = await res.json();
    if (!r.ok) throw new Error(r.msg || '上传失败');
    let msg = `<p class="ok">✓ 数据已上传（记录号 ${r.record_id}）</p>`;
    if (r.warnings) msg += `<p class="warn">⚠ 服务器警告：${r.warnings}</p><p class="muted">请把此截图发给实验者。</p>`;
    await card(`<h2>上传结果</h2>${msg}<div class="actions"><button class="btn gold" data-v="ok">确定</button></div>`);
    return true;
  } catch (err) {
    // 上传失败：给出原因 + 本地 CSV 备份，避免数据丢失
    const bak = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(trials.map(t => JSON.stringify(t)).join('\n'));
    const online = navigator.onLine ? '是' : '否';
    await card(`<h2>数据未能上传</h2><p class="warn">原因：${err.message}</p>
      <p class="muted">联网状态：${online}　|　错误类型：${err.name}</p>
      <p>实验数据已在本地备份，请点击下载并把文件发给实验者：</p>
      <div class="actions"><a class="btn gold" style="text-decoration:none" href="${bak}" download="backup_${experiment}.csv">下载备份数据</a>
      <button class="btn ghost" data-v="ok">继续</button></div>`);
    return false;
  }
}
async function loadAll(experiment) {
  const exp = STATE.test ? 'test_' + experiment : experiment;
  const r = await (await fetch(`${LAB}/api/hw2/data?project=${PROJECT}&experiment=${exp}`)).json();
  return r.records || [];
}

/* ================================================================
 * 实验一：专注计数 —— Most et al. (2001) 图形范式复现
 *   改进（被试间，随机分配）：知觉负荷 = 白色目标数量（Lavie set-size load）
 *     low  = 2 白 + 6 黑，只数白色碰边（目标少→负荷低）
 *     high = 6 白 + 2 黑，只数白色碰边（目标多→负荷高）
 *   两种条件都只数白色，避免"同时数两种颜色"的工作记忆过载
 *   预测：高负荷组对意外十字的注意到率更低（Lavie 知觉负荷理论；
 *         Simons & Chabris 1999 难/易任务 42% vs 58%/68%）
 * ================================================================ */
const IW = { x: 320, y: 80, w: 640, h: 560 };          // 灰色窗口
const TRIAL_MS = 15000, N_PRE = 2;                      // 原文：每轮 15 s，前 2 轮无意外物
const TOTAL1 = N_PRE + 2;                               // 实验一总轮数：3 轮计数 + 1 轮全注意 = 4
const N_W = { low: 2, high: 6 };                        // 各负荷条件的白色目标数
const COLORS8 = [['white','白色','#fff'],['lightgray','浅灰','#c5c5c5'],['darkgray','深灰','#818181'],['black','黑色','#1f1f1f'],['red','红色','#d33'],['blue','蓝色','#2f6fff'],['green','绿色','#3a3'],['yellow','黄色','#e8c21c']];
const DIRS8 = [['left','←'],['right','→'],['up','↑'],['down','↓'],['upleft','↖'],['upright','↗'],['downleft','↙'],['downright','↘']];
const SHAPES7 = ['十字','L 形','T 形','圆形','方形','三角形','星形'];

function mkShapes(nW = 4) {
  // nW 个白色 + (8-nW) 个黑色，L/T 交替；总数始终 8 个
  // 低负荷 nW=2（目标少），高负荷 nW=6（目标多）；都只数白色
  const GRACE = 1.5;
  const mk = (color, shape, i) => {
    const x = IW.x + 80 + (i % 4) * 120 + Math.random() * 30;   // 相对左边 80..470，+64=144..534，均距边 ≥96px
    const y = IW.y + 90 + Math.floor(i / 4) * 200 + Math.random() * 40;  // 90..330，+64=154..394，距边 ≥90px
    let vx = (Math.random() < .5 ? -1 : 1) * (40 + Math.random() * 30);   // 40–70 px/s
    let vy = (Math.random() < .5 ? -1 : 1) * (40 + Math.random() * 30);
    // 若当前速度会在 GRACE 秒内撞上某条边，就把该方向反转（朝远离边的方向走）
    const sp = Math.abs(vx);
    if (vx < 0 && (x - IW.x) / sp < GRACE) vx = -vx;
    if (vx > 0 && (IW.x + IW.w - 64 - x) / sp < GRACE) vx = -vx;
    const sp2 = Math.abs(vy);
    if (vy < 0 && (y - IW.y) / sp2 < GRACE) vy = -vy;
    if (vy > 0 && (IW.y + IW.h - 64 - y) / sp2 < GRACE) vy = -vy;
    return { color, shape, x, y, vx, vy };
  };
  const arr = [];
  for (let i = 0; i < 8; i++) {
    const color = i < nW ? 'white' : 'black';
    const shape = i % 2 === 0 ? 'L' : 'T';
    arr.push(mk(color, shape, i));
  }
  return arr;
}
function drawLetter(x, y, shape, color) {
  ctx.fillStyle = color;
  const s = 64, t = 16;
  if (shape === 'L') { ctx.fillRect(x, y, t, s); ctx.fillRect(x, y + s - t, s, t); }
  else { ctx.fillRect(x, y, s, t); ctx.fillRect(x + s / 2 - t / 2, y, t, s); }
}
function drawShapesScene(shapes) {
  ctx.fillStyle = '#1b1f27'; ctx.fillRect(0, 0, 1280, 800);
  ctx.fillStyle = '#a3a3a3'; ctx.fillRect(IW.x, IW.y, IW.w, IW.h);          // 窗口底色 sRGB 163
  ctx.strokeStyle = '#555'; ctx.lineWidth = 3; ctx.strokeRect(IW.x, IW.y, IW.w, IW.h);
  for (const s of shapes) drawLetter(s.x, s.y, s.shape, s.color === 'white' ? '#ffffff' : '#1f1f1f');
}
function drawCross(cy, cx) {
  const L = 96, T = 24;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(cx - L / 2, cy - T / 2, L, T);
  ctx.fillRect(cx - T / 2, cy - L / 2, T, L);
}
// 顶部进度条："第 x / N 轮"——每帧重绘，保证整轮可见
function drawBanner(text) {
  ctx.save();
  ctx.fillStyle = 'rgba(13,43,92,.92)';
  ctx.fillRect(0, 0, 1280, 46);
  ctx.fillStyle = '#C8A44A';
  ctx.font = `700 24px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 640, 23);
  ctx.restore();
}
// 单轮动画：返回 {w, b} 各颜色碰边总次数（角落同帧只计 1 次）。shapes 由外部传入，与倒计时同组
function animTrial({ critical, load, banner, shapes }) {
  return new Promise((resolve) => {
    shapes = shapes || mkShapes();
    const counts = { w: 0, b: 0 };
    let cross = null, crossY = 0, t0 = performance.now();
    const step = (now) => {
      const t = now - t0;
      // 位置更新 + 碰边计数
      for (const s of shapes) {
        s.x += s.vx * 0.016; s.y += s.vy * 0.016;
        let hit = false;
        if (s.x <= IW.x + 2 && s.vx < 0) { s.vx = -s.vx; hit = true; }
        if (s.x + 64 >= IW.x + IW.w - 2 && s.vx > 0) { s.vx = -s.vx; hit = true; }
        if (s.y <= IW.y + 2 && s.vy < 0) { s.vy = -s.vy; hit = true; }
        if (s.y + 64 >= IW.y + IW.h - 2 && s.vy > 0) { s.vy = -s.vy; hit = true; }
        if (hit) (s.color === 'white') ? counts.w++ : counts.b++;
      }
      // 意外十字：第 5 s 出现，从右往左，可见 5 s；路径严格限定在灰色框内
      if (critical && t >= 5000 && !cross) {
        // 出现高度远离白色（被注意）图形聚集处
        const whites = shapes.filter(s => s.color === 'white');
        const avgY = whites.length ? whites.reduce((a, s) => a + s.y, 0) / whites.length : IW.y + IW.h / 2;
        const L = 96;                                            // 十字尺寸（同 drawCross）
        crossY = Math.min(IW.y + IW.h - L / 2 - 4, Math.max(IW.y + L / 2 + 4, avgY < IW.y + IW.h / 2 ? IW.y + IW.h * 0.78 : IW.y + IW.h * 0.22));
        cross = IW.x + IW.w - L / 2;                             // 十字右边缘贴右边框出现
      }
      if (cross !== null) cross -= 109 * 0.016;                  // 5 s 走完 544 px（框内宽度-IW.w 减 一个十字宽）
      drawShapesScene(shapes);
      if (cross !== null && cross > IW.x + 48) drawCross(crossY, cross);  // 十字左边缘到左边框即消失
      if (banner) drawBanner(banner);                   // 顶部"第 x / N 轮"进度条
      if (t < TRIAL_MS) requestAnimationFrame(step);
      else resolve(counts);
    };
    requestAnimationFrame(step);
  });
}
async function countdown(msg, banner, shapes) {
  shapes = shapes || mkShapes();
  for (const n of [3, 2, 1]) { drawShapesScene(shapes); if (banner) drawBanner(banner); ctx.fillStyle = '#fff'; ctx.font = `700 90px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(n, 640, 440); $('#exp-hud').textContent = msg; await sleep(600); }
}
async function countInput(title, fields) {
  const r = await card(`<form><h2>${title}</h2>${fields.map(([n, l]) => `<p>${l}：<input name="${n}" type="number" min="0" max="500" required class="inp-big"></p>`).join('')}<div class="actions"><button class="btn gold">确定</button></div></form>`);
  const out = {}; for (const [n] of fields) out[n] = r[n] === '' ? null : +r[n];
  return out;
}
const seenGuess = `<p style="margin-top:8px"><label><input type="radio" name="seen" value="yes" required> 我确实看到了</label>　<label><input type="radio" name="seen" value="no"> 我没看到，是猜的</label></p>`;
// 图例辅助：颜色色块 / 形状字符图例
const colorSw = (c) => `<i class="sw-color" style="background:${c}"></i>`;
const SHAPE_GLYPH = { '十字': '✚', 'L形': 'L', 'T形': 'T', '圆形': '●', '方形': '■', '三角形': '▲', '星形': '★' };
const shapeSw = (s) => `<i class="sw-glyph">${SHAPE_GLYPH[s] || ''}</i>`;
// 运动方式选项（文字）
const MOTIONS = ['从左到右', '从右到左', '从上到下', '从下到上', '斜向移动', '没有移动', '不确定'];
// pickRow：第三参数 icon 为任意 HTML 片段（颜色色块 / 形状图例 / 空）
const pickRow = (name, opts) => `<input type="hidden" name="${name}" required><div class="pick">${opts.map(([v, label, icon]) => `<button type="button" data-pick="${name}" data-val="${v}">${icon || ''}${label}</button>`).join('')}</div>`;

const qRow = (label, inner) => `<div class="qrow"><span class="qrow-label">${label}</span>${inner}</div>`;
// 合并问询卡：形状（图例）+ 颜色（色块）+ 运动方式（文字），单页提交
const guessCard = (lead) => `<form><h2>${lead}长什么样？</h2><p class="muted">没看到也请每项都猜一个。</p>
  ${qRow('形状：', pickRow('shape', SHAPES7.map(s => [s, s, shapeSw(s)])))}
  ${qRow('颜色：', pickRow('color', COLORS8.map(([v, l, c]) => [v, l, colorSw(c)])))}
  ${qRow('运动方式：', pickRow('motion', MOTIONS.map(m => [m, m])))}
  ${seenGuess}
  <div class="actions"><button class="btn gold">提交</button></div></form>`;

async function runInattention() {
  // 被试间随机分配负荷条件
  STATE.load = Math.random() < .5 ? 'low' : 'high';
  const nW = N_W[STATE.load];                                // 低负荷 2 白，高负荷 6 白（都只数白色）
  $('#exp-hud').textContent = '实验一 · 专注计数';
  drawShapesScene(mkShapes(nW));
  await card(`<h2>实验一 · 专注计数</h2>
    <p>这一关需要你<b>认真盯住画面</b>，约 4 分钟。</p>
    <p>屏幕中央有个灰色窗口，里面若干<b>白色</b>和<b>黑色</b>的 L 形、T 形在来回移动，碰到边就反弹。你要做的是<b>用眼睛跟着白色图形</b>，数它们一共碰了几次边（黑色的不用管）。</p>
    <p>提醒一点：图形要是<b>撞到角落</b>，只算一次，别数成两次哦~</p>
    <p>先来<b>1 轮练习</b>（不计入成绩，帮你熟悉），再正式 ${N_PRE + 1} 轮计数，每轮 <b>15 秒，只播一次</b>。每轮前有 3、2、1 倒计时，结束后把次数填进框里。练习和前两轮会马上告诉你准不准；第三轮结束后先问几个小问题，再给反馈。三轮数完，还有一轮换种方式看，不用数。</p>
    <p>过程中不管冒出什么，都按<b>真实感受</b>回答——没看到就坦白说没看到，不用猜对错。数错了也没关系，专注本身比数对更重要。</p>
    <p class="muted">准备好了就开始吧。</p>
    <div class="actions"><button class="btn gold" data-v="ok">开始</button></div>`);
  const trials = [];
  /* —— 练习轮：不计入成绩，让被试先熟悉操作 —— */
  {
    const banner = '实验一 · 专注计数　练习（不计入成绩）';
    const shapes = mkShapes(nW);
    await countdown('练习轮', banner, shapes);
    const c = await animTrial({ critical: false, load: STATE.load, banner, shapes });
    const ans = await countInput('练习：白色图形一共碰边几次？', [['cw', '']]);
    const err = Math.abs(ans.cw == null ? 0 : ans.cw - c.w), ok = err <= 1;
    await card(`<h2>练习结束</h2><p style="font-size:20px">你数 <b>${ans.cw}</b> 次，实际 <b>${c.w}</b> 次，误差 <b style="color:${ok ? '#2e7d32' : '#c62828'}">±${err}</b> ${ok ? '<span class="ok">✓ 很准</span>' : ''}</p><p class="muted">这是练习，<b>不计入成绩</b>。接下来正式开始。</p><div class="actions"><button class="btn gold" data-v="ok">开始正式计数</button></div>`);
  }
  for (let k = 0; k <= N_PRE; k++) {
    const critical = k === N_PRE;
    const banner = `实验一 · 专注计数　第 ${k + 1} / ${TOTAL1} 轮`;
    const shapes = mkShapes(nW);                                     // 倒计时与动画共用同一组，过渡不跳变
    await countdown(`实验一 · 第 ${k + 1}/${N_PRE + 1} 轮`, banner, shapes);
    const c = await animTrial({ critical, load: STATE.load, banner, shapes });
    const ans = await countInput(`第 ${k + 1} 轮：白色图形一共碰边几次？`, [['cw', '']]);
    const rec = { idx: k + 1, kind: critical ? 'critical' : 'pre', load: STATE.load, cross_color: 'white',
      count_w: ans.cw, true_w: c.w, err_w: ans.cw == null ? null : ans.cw - c.w };
    // 关键轮先问询再反馈（避免反馈污染问询）
    if (!critical) {
      trials.push(rec);
      const err = Math.abs(rec.err_w), ok = err <= 1;
      await card(`<h2>第 ${k + 1} 轮计数</h2><p style="font-size:20px">你数的 <b>${rec.count_w}</b> 次，实际 <b>${rec.true_w}</b> 次，误差 <b style="color:${ok ? '#2e7d32' : '#c62828'}">±${err}</b> ${ok ? '<span class="ok">✓ 很准</span>' : ''}</p><div class="actions"><button class="btn gold" data-v="ok">继续</button></div>`);
    } else {
      /* —— 问询：按 Most et al. (2001) 附录顺序 —— */
      const q1 = await card(yesNo('再回答几个问题', '<p>在<b>刚才这一轮</b>中，除了黑白色的 L、T 之外，你有没有看到<b>任何其他东西</b>（前两轮没有出现过的）？</p>'));
      let desc = '';
      const lead = q1.v === 'yes' ? '你看到的那个东西' : '假如刚才出现过一个之前没有的东西，它';
      const qg = await card(guessCard(lead));
      Object.assign(rec, { q1: q1.v, desc, shape: qg.shape, color: qg.color, motion: qg.motion, seen: qg.seen });
      trials.push(rec);
      await card(`<h2>第 ${k + 1} 轮计数</h2><p style="font-size:20px">你数的 <b>${rec.count_w}</b> 次，实际 <b>${rec.true_w}</b> 次。</p><div class="actions"><button class="btn gold" data-v="ok">继续</button></div>`);
    }
  }
  /* —— 第 4 轮：全注意对照（不计数，只看） —— */
  await card(`<h2>最后一轮</h2><p>这一轮<b>不用数任何东西</b>，只需要自然地看着画面。</p><div class="actions"><button class="btn gold" data-v="ok">开始</button></div>`);
  const shapesF = mkShapes(nW);
  await countdown('最后一轮 · 只看', `实验一 · 专注计数　第 ${TOTAL1} / ${TOTAL1} 轮（全注意）`, shapesF);
  await animTrial({ critical: true, load: STATE.load, banner: `实验一 · 专注计数　第 ${TOTAL1} / ${TOTAL1} 轮（全注意）`, shapes: shapesF });
  const f1 = await card(yesNo('这一轮', '<p>这一轮中，除了黑白色的 L、T 之外，你有没有看到任何其他东西？</p>'));
  const fg = await card(guessCard(f1.v === 'yes' ? '你看到的那个东西' : '假如刚才出现过一个东西，它'));
  trials.push({ idx: 4, kind: 'full', load: STATE.load, q1: f1.v, shape: fg.shape, color: fg.color, motion: fg.motion, seen: fg.seen });
  await submitData('inattention', STATE.load, trials);
  return trials;
}

/* ================================================================
 * 实验二："你在这里"地图 —— Levine (1982) 复现
 *   改进（被试内）：朝向线索
 *     一半试次地图上多画一个红色箭头，直接标出"你面朝的方向"
 *   预测：线索基本消除不对齐地图的代价（尤其 180°）——
 *         空间参照系对齐 / 心理旋转
 * ================================================================ */
const LANDMARKS = ['图书馆','食堂','体育馆','教学楼','宿舍','校医院','实验楼','礼堂'];
const KEYS = { ArrowUp: 'F', ArrowRight: 'R', ArrowDown: 'B', ArrowLeft: 'L' };
const DIR_CN = { F: '前方', R: '右边', B: '后方', L: '左边' };
const MAPC = { x: 950, y: 400, h: 250 };                 // 地图中心与半边长
const BLCOLORS = ['#b5651d', '#2f6db3', '#2e7d32', '#7d3c98'];
const D2R = Math.PI / 180;

function drawView(name) {                                 // 左：第一人称视野（正面朝 name）
  const x0 = 60, y0 = 100, w = 540, h = 560;
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
  const g = ctx.createLinearGradient(0, y0, 0, y0 + 300); g.addColorStop(0, '#9cc8ef'); g.addColorStop(1, '#dcecf9');
  ctx.fillStyle = g; ctx.fillRect(x0, y0, w, 300);

  ctx.fillStyle = '#e4dccb'; ctx.beginPath(); ctx.moveTo(x0 + 190, y0 + h); ctx.lineTo(x0 + 250, y0 + 300); ctx.lineTo(x0 + 290, y0 + 300); ctx.lineTo(x0 + 350, y0 + h); ctx.fill();
  ctx.fillStyle = '#b5651d'; ctx.fillRect(x0 + 150, y0 + 130, 240, 172);  // 正前方的楼
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) ctx.fillRect(x0 + 168 + c * 54, y0 + 175 + r * 50, 32, 30);
  ctx.fillStyle = '#fff'; ctx.fillRect(x0 + 200, y0 + 145, 140, 38);
  ctx.fillStyle = '#1b1f27'; ctx.font = `700 22px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(name, x0 + 270, y0 + 165);
  for (const [tx, s] of [[x0 + 50, 1.2], [x0 + 110, .85], [x0 + 440, .85], [x0 + 500, 1.2]]) {
    ctx.fillStyle = '#6d4c2f'; ctx.fillRect(tx - 8 * s, y0 + 300 + 40 * s, 16 * s, 80 * s);
    ctx.fillStyle = '#3f7a3a'; ctx.beginPath(); ctx.arc(tx, y0 + 300 + 8 * s, 62 * s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#cfd6e2'; ctx.font = `600 22px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('你眼前看到的（你正面朝它）', x0 + w / 2, y0 - 30);
}
function drawYah(t) {                                     // t: {names, rot, cue, ask}
  ctx.fillStyle = '#1b1f27'; ctx.fillRect(0, 0, 1280, 800);
  drawView(t.names.F);
  const { x: MX, y: MY, h: MH } = MAPC;
  // 导览牌
  ctx.fillStyle = '#0D2B5C'; ctx.fillRect(MX - MH - 25, MY - MH - 70, 2 * MH + 50, 2 * MH + 95);
  ctx.fillStyle = '#C8A44A'; ctx.font = `700 24px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('校园导览图', MX, MY - MH - 42);
  ctx.save(); ctx.beginPath(); ctx.rect(MX - MH, MY - MH, 2 * MH, 2 * MH); ctx.clip();
  ctx.fillStyle = '#eef0e6'; ctx.fillRect(MX - MH, MY - MH, 2 * MH, 2 * MH);
  ctx.translate(MX, MY); ctx.rotate(t.rot * D2R);
  ctx.fillStyle = '#e4dccb'; ctx.fillRect(-24, -MH - 40, 48, 2 * MH + 80); ctx.fillRect(-MH - 40, -24, 2 * MH + 80, 48);
  ctx.fillStyle = '#cfe5c0'; ctx.beginPath(); ctx.arc(0, 0, 62, 0, Math.PI * 2); ctx.fill();
  ['F','R','B','L'].forEach((d, i) => { ctx.save(); ctx.rotate(i * 90 * D2R); ctx.fillStyle = BLCOLORS[i]; ctx.fillRect(-80, -MH + 28, 160, 80); ctx.restore(); });
  ctx.restore();
  // 地标名（保持正立）与红点
  ctx.font = `700 22px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ['F','R','B','L'].forEach((d, i) => {
    const a = (i * 90 + t.rot) * D2R, r = MH - 68;
    const x = MX + Math.sin(a) * r, y = MY - Math.cos(a) * r;
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fillRect(x - 52, y - 17, 104, 34);
    ctx.fillStyle = '#1b1f27'; ctx.fillText(t.names[d], x, y);
  });
  ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.arc(MX, MY, 13, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = '#c62828'; ctx.font = `700 18px ${FONT}`; ctx.fillText('你在这里', MX, MY + 32);
  // ★ 改进条件：朝向线索——从红点指向"你面朝的楼"在地图上的方向
  if (t.cue) {
    const a = t.rot * D2R, L = 150;
    const ex = MX + Math.sin(a) * L, ey = MY - Math.cos(a) * L;
    ctx.strokeStyle = '#ff1744'; ctx.fillStyle = '#ff1744'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(MX, MY); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(Math.atan2(ex - MX, MY - ey));
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(-13, 6); ctx.lineTo(13, 6); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.font = `700 20px ${FONT}`; ctx.fillStyle = '#ff1744';
    ctx.fillText('你面朝这边', MX + Math.sin(a) * (L + 52), MY - Math.cos(a) * (L + 52));
  }
  if (t.ask) {
    ctx.fillStyle = '#fff'; ctx.font = `600 30px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText(`「${t.names[t.ask]}」在你的哪一边？`, 640, 756);
    ctx.fillStyle = '#8e97a8'; ctx.font = `500 21px ${FONT}`;
    ctx.fillText('↑ 前方　↓ 后方　← 左边　→ 右边', 640, 790);
  }
}
function waitKey(timeout) {
  return new Promise((resolve) => {
    const t0 = performance.now();
    let doneFlag = false;
    const fin = (key) => { if (doneFlag) return; doneFlag = true; removeEventListener('keydown', h); resolve({ key, rt: performance.now() - t0 }); };
    const h = (e) => { const code = KEYS[e.key]; if (code) { e.preventDefault(); fin(code); } };
    addEventListener('keydown', h);
    setTimeout(() => fin(null), timeout);
  });
}
async function runYah() {
  $('#exp-hud').textContent = '实验二 · "你在这里"地图';

  await card(`<h2>实验二 · "你在这里"地图</h2>

    <p>有个地方容易绕进去：导览图<b>不一定正着挂</b>，可能被转了 90°、180° 或 270°。地图上的"上"未必是你面前的方向——得先看"你正面朝的那栋楼"在地图哪个位置，把图和自己对上号再判断。</p>
    <p>先来 2 次练习（会告诉你对错），再正式 <b>24 次</b>。每次先看一个"+"，画面出来后<b>又快又准</b>地按；超过 9 秒就算"太慢了"。正式阶段不再逐题提示对错，凭直觉答就行。</p>
    <div class="actions"><button class="btn gold" data-v="ok">开始</button></div>`);

  for (let i = 0; i < 12; i++) list.push(mk(0, i % 2 === 0, ['R','B','L'][i % 3]));            // 对齐 ×12（无线索 6）
  for (const rot of [90, 180, 270]) for (let i = 0; i < 4; i++) list.push(mk(rot, i % 2 === 0, ['R','B','L'][i % 3])); // 不对齐 ×12

      let html = '';
      // 专注计数：各组注意到率（关键轮 q1 === 'yes'）
      const groups = { low: [0, 0], high: [0, 0] };
      for (const rec of iaAll) {
        const c = (rec.trials || []).find(t => t.kind === 'critical');
        if (!c) continue;
        const g = rec.condition === 'high' ? 'high' : 'low';
        groups[g][0]++; if (c.q1 === 'yes') groups[g][1]++;
      }
      html += `<h4>专注计数：注意到意外十字的比例（红线 = Most et al. (2001) 颜色匹配条件 94%）</h4>`;
      for (const g of ['low', 'high']) {
        const n = groups[g][0], pct = n ? 100 * groups[g][1] / n : 0;
        html += bar(`${g === 'high' ? '高负荷·6 白目标（改进）' : '低负荷·2 白目标（复现）'}（n=${n}）`, pct, g === 'high', g === 'low' ? 94 : null);
      }
      // YAH：2×2 正确率与 RT
      const cell = (al, cu) => yahAll.flatMap(r => (r.trials || []).filter(t => (t.rot === 0) === al && t.cue === cu));
      const pctOf = (a) => a.length ? 100 * a.filter(t => t.correct === 1).length / a.length : 0;
      const rtOf = (a) => { const x = a.filter(t => t.correct === 1).map(t => t.rt); return x.length ? Math.round(median(x)) : 0; };
      html += `<h4 style="margin-top:18px">YAH 地图：正确率（2×2：对齐 × 朝向线索）</h4>`;
      html += bar('对齐 · 无线索', pctOf(cell(true, 0)));
      html += bar('对齐 · 有线索', pctOf(cell(true, 1)), true);
      html += bar('不对齐 · 无线索', pctOf(cell(false, 0)));
      html += bar('不对齐 · 有线索', pctOf(cell(false, 1)), true);
      html += `<h4 style="margin-top:18px">YAH 地图：正确试次中位 RT（ms）</h4><table class="res">
        <tr><th></th><th>无线索</th><th>有线索</th></tr>
        <tr><th>对齐</th><td>${rtOf(cell(true, 0))}</td><td>${rtOf(cell(true, 1))}</td></tr>
        <tr><th>不对齐</th><td>${rtOf(cell(false, 0))}</td><td>${rtOf(cell(false, 1))}</td></tr></table>`;
      html += `<p class="muted">预测：不对齐·无线索 应最慢最易错；朝向线索应大幅缩小（甚至消除）不对齐代价；高负荷组注意到率应低于低负荷组。</p>`;
      $('#res-all').innerHTML = html;
    } catch (e) {
      $('#res-all').innerHTML = '<p class="warn">全体数据读取失败（可能未联网），稍后刷新重试。</p>';
    }
  })();
}

/* ---------------- 主流程 ---------------- */
$('#btn-start').onclick = async () => {
  const nick = $('#nick').value.trim();
  if (!nick) { $('#intro-err').textContent = '请先填一个昵称或编号（不要用真实姓名）。'; return; }
  STATE.nick = nick;
  STATE.test = $('#testmode').checked;
  showScreen('scr-exp');
  const iaTrials = await runInattention();
  const yahTrials = await runYah();
  showScreen('scr-res');
  renderResults(iaTrials, yahTrials);
};
/* 触屏按钮 → 模拟方向键 */
document.querySelectorAll('#touchpad button').forEach(b => b.onclick = () => dispatchEvent(new KeyboardEvent('keydown', { key: b.dataset.k })));
</script>
